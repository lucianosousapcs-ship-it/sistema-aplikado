<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --sidebar-w: 230px;
        --bg-app: #f5f7fa;
        --bg-card: #ffffff;
        --bg-card-alt: #fafbfc;
        --bg-hover: #fff8ed;
        --border: #e3e7eb;
        --border-light: #d1d8e0;
        --text-primary: #1f2937;
        --text-secondary: #4b5563;
        --text-muted: #9ca3af;
        --accent: #FF8C00;
        --accent-hover: #e07000;
        --accent-dark: #cc7000;
        --accent-glow: rgba(255, 140, 0, 0.15);
        --copa: #7c3aed;
        --success: #059669;
        --success-bg: #ecfdf5;
        --danger: #dc2626;
        --danger-bg: #fef2f2;
        --warning: #d97706;
        --warning-bg: #fffbeb;
        --info: #0891b2;
        --info-bg: #ecfeff;
        --nav-bg: #0a0f15;
        --nav-text: #FF8C00;
        --shadow-sm: 0 1px 3px rgba(16,24,40,0.06);
        --shadow-md: 0 4px 16px rgba(16,24,40,0.10);
        --shadow-lg: 0 12px 40px rgba(16,24,40,0.15);
        --glow-orange: 0 0 0 3px rgba(255, 140, 0, 0.12);
    }

    html, body { height: 100%; overflow: hidden; }

    body {
        background: var(--bg-app);
        font-family: 'Inter', sans-serif;
        color: var(--text-primary);
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
    }

    /* LAYOUT */
    .app { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

    /* SIDEBAR — mantém preto com laranja (executivo) */
    .sidebar {
        width: var(--sidebar-w);
        background: var(--nav-bg);
        color: var(--nav-text);
        display: flex; flex-direction: column; flex-shrink: 0;
        border-right: 1px solid #1a2332;
        box-shadow: 4px 0 20px rgba(0,0,0,0.15);
        position: relative; z-index: 10;
    }
    .sidebar-brand {
        padding: 20px 20px 18px;
        border-bottom: 1px solid rgba(255, 140, 0, 0.15);
        display: flex; align-items: center; gap: 10px;
    }
    .sidebar-brand .brand-logo {
        width: 38px; height: 38px;
        background: linear-gradient(135deg, #FF8C00, #cc7000);
        border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        color: #0a0f15; font-weight: 900; font-size: 17px;
        flex-shrink: 0;
        box-shadow: 0 4px 12px rgba(255, 140, 0, 0.4);
    }
    .sidebar-brand .brand-text {
        font-size: 14px; font-weight: 800; color: #fff;
        letter-spacing: -0.2px; line-height: 1.1;
    }
    .sidebar-brand .brand-text small {
        display: block; font-size: 10px; font-weight: 500;
        color: rgba(255, 140, 0, 0.8); margin-top: 3px; letter-spacing: 0.5px;
    }

    .sidebar-section-title {
        font-size: 9.5px; text-transform: uppercase; letter-spacing: 1px;
        color: rgba(255, 140, 0, 0.5); font-weight: 700;
        padding: 16px 20px 8px;
    }

    .sidebar-nav { flex: 1; padding: 6px 10px; overflow-y: auto; }
    .sidebar-nav::-webkit-scrollbar { width: 4px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255, 140, 0, 0.3); border-radius: 2px; }

    .nav-item {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 12px; border-radius: 8px;
        color: var(--nav-text); font-size: 12.5px; font-weight: 600;
        cursor: pointer; transition: all 0.2s;
        margin-bottom: 2px;
        border: none; background: transparent;
        width: 100%; text-align: left;
        font-family: inherit; text-decoration: none;
    }
    .nav-item:hover {
        background: rgba(255, 140, 0, 0.1);
        color: #ffb347;
        transform: translateX(3px);
    }
    .nav-item.active {
        background: linear-gradient(90deg, rgba(255, 140, 0, 0.25), rgba(255, 140, 0, 0.05));
        color: #fff; font-weight: 700;
        box-shadow: inset 3px 0 0 var(--accent), 0 2px 12px rgba(255, 140, 0, 0.15);
    }
    .nav-item i {
        width: 18px; font-size: 13px; text-align: center;
        opacity: 0.9; flex-shrink: 0; color: var(--nav-text);
    }
    .nav-item.active i { opacity: 1; color: var(--accent); }
    .nav-item .nav-count {
        margin-left: auto;
        background: rgba(255, 140, 0, 0.15);
        color: var(--nav-text);
        font-size: 10px; font-weight: 800;
        padding: 2px 7px; border-radius: 10px;
    }
    .nav-item.active .nav-count { background: var(--accent); color: #0a0f15; }

    .sidebar-footer {
        padding: 12px 10px;
        border-top: 1px solid rgba(255, 140, 0, 0.15);
        display: flex; flex-direction: column; gap: 2px;
    }
    .sidebar-footer .nav-item { font-size: 12px; }
    .sidebar-footer .btn-sair { color: #ff6b6b; }
    .sidebar-footer .btn-sair:hover { background: rgba(220, 38, 38, 0.25); color: #fff; }

    /* MAIN */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    .topbar {
        background: #fff;
        border-bottom: 1px solid var(--border);
        padding: 14px 24px;
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px; flex-shrink: 0;
        box-shadow: 0 1px 3px rgba(16,24,40,0.04);
    }
    .topbar-title h1 {
        font-size: 17px; font-weight: 800;
        color: var(--text-primary);
        letter-spacing: -0.3px;
        display: flex; align-items: center; gap: 9px;
    }
    .topbar-title h1 i { color: var(--accent); font-size: 16px; }
    .topbar-title p {
        font-size: 11.5px; color: var(--text-muted);
        margin-top: 2px; font-weight: 500;
    }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }

    /* DASHBOARD CARDS — claros, executivos */
    .dashboard {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 12px;
        padding: 16px 24px 4px;
        flex-shrink: 0;
    }
    .stat-card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        display: flex; flex-direction: column; gap: 4px;
        box-shadow: var(--shadow-sm);
        transition: all 0.25s;
        position: relative; overflow: hidden;
        cursor: pointer;
    }
    .stat-card::before {
        content: ''; position: absolute; left: 0; top: 0; bottom: 0;
        width: 3px; background: var(--accent);
    }
    .stat-card:hover {
        box-shadow: var(--shadow-md), var(--glow-orange);
        transform: translateY(-2px);
        border-color: var(--accent);
    }
    .stat-label {
        font-size: 10px; text-transform: uppercase;
        letter-spacing: 0.6px; font-weight: 700;
        color: var(--text-muted);
        display: flex; align-items: center; justify-content: space-between;
    }
    .stat-label .stat-hint {
        font-size: 8px; color: var(--accent); opacity: 0;
        transition: opacity 0.2s;
    }
    .stat-card:hover .stat-hint { opacity: 1; }
    .stat-value {
        font-size: 19px; font-weight: 800;
        color: var(--text-primary);
        line-height: 1.15; letter-spacing: -0.5px;
    }
    .stat-value.negativo { color: var(--danger); }
    .stat-value.positivo { color: var(--success); }
    .stat-sub {
        font-size: 10px; color: var(--text-muted);
        font-weight: 500; display: flex; align-items: center; gap: 4px;
    }

    /* CONTENT */
    .content {
        flex: 1; overflow: hidden;
        padding: 12px 24px 20px;
        display: flex; flex-direction: column; min-height: 0;
    }
    .tab-content { display: none; flex-direction: column; height: 100%; min-height: 0; }
    .tab-content.active { display: flex; }

    /* FILTER BAR — clara */
    .filter-bar {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 14px;
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
        box-shadow: var(--shadow-sm);
        flex-shrink: 0; margin-bottom: 12px;
    }
    .filter-bar .search-box { position: relative; flex: 1; min-width: 160px; max-width: 280px; }
    .filter-bar .search-box input {
        width: 100%;
        padding: 8px 12px 8px 32px;
        background: #f9fafb;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 12px; font-family: inherit;
        outline: none; transition: all 0.18s;
    }
    .filter-bar .search-box input::placeholder { color: var(--text-muted); }
    .filter-bar .search-box input:focus {
        background: #fff;
        border-color: var(--accent);
        box-shadow: var(--glow-orange);
    }
    .filter-bar .search-box::before {
        content: '\f002';
        font-family: 'Font Awesome 6 Free'; font-weight: 900;
        position: absolute; left: 12px; top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted); font-size: 11px;
        pointer-events: none;
    }

    .filter-select {
        padding: 8px 12px;
        background: #f9fafb;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 12px; font-family: inherit; font-weight: 500;
        outline: none; cursor: pointer; transition: all 0.18s;
    }
    .filter-select:focus {
        background: #fff;
        border-color: var(--accent);
        box-shadow: var(--glow-orange);
    }

    .btn {
        padding: 8px 14px;
        border: 1px solid transparent;
        border-radius: 8px;
        font-size: 12px; font-weight: 600;
        font-family: inherit; cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px;
        transition: all 0.18s; white-space: nowrap;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--accent); color: #fff; font-weight: 700; }
    .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 12px rgba(255,140,0,0.35); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: #047857; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-copa { background: var(--copa); color: #fff; font-weight: 700; }
    .btn-copa:hover { background: #6d28d9; }
    .btn-outline {
        background: #fff; color: var(--text-secondary);
        border-color: var(--border-light);
    }
    .btn-outline:hover { background: #f9fafb; color: var(--text-primary); border-color: var(--accent); }
    .btn-xs { padding: 4px 8px; font-size: 10.5px; }

    /* TABLE CARD */
    .table-card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow-sm);
        flex: 1; display: flex; flex-direction: column;
        overflow: hidden; min-height: 0;
    }
    .table-card-header {
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; flex-shrink: 0;
        background: linear-gradient(180deg, #fafbfc, #fff);
    }
    .table-card-header h3 {
        font-size: 13.5px; font-weight: 700;
        color: var(--text-primary);
        display: flex; align-items: center; gap: 8px;
    }
    .table-card-header h3 i { color: var(--accent); font-size: 13px; }
    .badge-count {
        background: var(--accent-glow);
        color: var(--accent-dark);
        font-size: 10px; font-weight: 800;
        padding: 3px 10px; border-radius: 10px;
        border: 1px solid rgba(255, 140, 0, 0.3);
    }

    .table-wrapper { flex: 1; overflow: auto; min-height: 0; }
    .table-wrapper::-webkit-scrollbar { width: 8px; height: 8px; }
    .table-wrapper::-webkit-scrollbar-track { background: #f9fafb; }
    .table-wrapper::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .table-wrapper::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    table thead th {
        background: linear-gradient(180deg, #0a0f15, #1a2332);
        color: var(--accent);
        font-size: 10px; font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.6px;
        padding: 12px 8px; text-align: center;
        border-bottom: 2px solid var(--accent);
        position: sticky; top: 0; z-index: 5;
        white-space: nowrap; cursor: pointer; user-select: none;
        transition: all 0.15s;
    }
    table thead th:hover {
        background: linear-gradient(180deg, #1a2332, #2a3a52);
        color: #ffb347;
    }
    table thead th .sort-icon { margin-left: 4px; opacity: 0.4; font-size: 9px; }
    table thead th.sorted-asc .sort-icon,
    table thead th.sorted-desc .sort-icon { opacity: 1; color: var(--accent); }
    table thead th:first-child { text-align: left; padding-left: 16px; }

    table tbody td {
        padding: 11px 8px;
        border-bottom: 1px solid #f1f3f5;
        text-align: center;
        color: var(--text-primary);
        white-space: nowrap;
        font-size: 11.5px;
        transition: all 0.15s;
    }
    table tbody td:first-child {
        text-align: left; padding-left: 16px; font-weight: 700;
    }
    table tbody tr { transition: all 0.15s; }
    table tbody tr:nth-child(even) td { background: #fafbfc; }
    table tbody tr:hover td {
        background: #fff8ed !important;
        box-shadow: inset 0 0 0 1px rgba(255, 140, 0, 0.15);
    }
    table tbody tr.copa-row td { background: #faf8ff; }
    table tbody tr.copa-row:nth-child(even) td { background: #f6f3fd; }
    table tbody tr.copa-row:hover td {
        background: #eee7fb !important;
        box-shadow: inset 0 0 0 1px rgba(124, 58, 237, 0.2);
    }

    .cell-clickable { cursor: pointer; position: relative; }
    .cell-clickable:hover {
        color: var(--accent) !important;
        text-decoration: underline;
        text-decoration-style: dotted;
    }
    .cell-money { font-weight: 700; font-variant-numeric: tabular-nums; }
    .cell-money.positivo { color: var(--success); }
    .cell-money.negativo { color: var(--danger); }
    .cell-money.neutro { color: var(--text-primary); }

    /* BADGES */
    .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        border: 1px solid transparent;
    }
    .badge-receita { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
    .badge-despesa { background: #fecaca; color: #991b1b; border-color: #fca5a5; }
    .badge-pago { background: #a7f3d0; color: #064e3b; border-color: #6ee7b7; }
    .badge-nao-pago { background: #fecaca; color: #991b1b; border-color: #fca5a5; }
    .badge-pendente { background: #fde68a; color: #92400e; border-color: #fcd34d; }
    .badge-alerta { background: #fde68a; color: #92400e; border-color: #fcd34d; }
    .badge-geral { background: #fed7aa; color: #9a3412; border-color: #fdba74; }
    .badge-copa { background: #ddd6fe; color: #5b21b6; border-color: #c4b5fd; }

    .badge-desvio-ok { background: #a7f3d0; color: #064e3b; }
    .badge-desvio-atencao { background: #fde68a; color: #92400e; }
    .badge-desvio-critico { background: #fecaca; color: #991b1b; }

    /* EMPTY STATE */
    .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
    .empty-state i {
        font-size: 42px; color: rgba(255, 140, 0, 0.35);
        display: block; margin-bottom: 12px;
    }
    .empty-state p { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    .empty-state p.sub { font-size: 11px; font-weight: 500; color: var(--text-muted); margin-top: 4px; }

    /* RESUMO CARDS */
    .resumo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px; margin-bottom: 12px; flex-shrink: 0;
    }
    .resumo-card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        box-shadow: var(--shadow-sm);
        position: relative; overflow: hidden;
        cursor: pointer; transition: all 0.2s;
    }
    .resumo-card::before {
        content: ''; position: absolute; left: 0; top: 0; bottom: 0;
        width: 3px; background: var(--accent);
    }
    .resumo-card:hover {
        border-color: var(--accent);
        box-shadow: var(--shadow-md), var(--glow-orange);
        transform: translateY(-2px);
    }
    .resumo-card h4 {
        font-size: 9.5px; color: var(--text-muted);
        text-transform: uppercase; letter-spacing: 0.5px;
        margin-bottom: 6px; font-weight: 700;
    }
    .resumo-card .valor {
        font-size: 18px; font-weight: 800;
        color: var(--text-primary);
        line-height: 1.1; letter-spacing: -0.3px;
    }
    .resumo-card .valor.positivo { color: var(--success); }
    .resumo-card .valor.negativo { color: var(--danger); }
    .resumo-card .valor.copa { color: var(--copa); }
    .resumo-card .detalhe {
        font-size: 10px; color: var(--text-muted);
        margin-top: 5px; display: flex;
        justify-content: space-between; gap: 8px; font-weight: 500;
    }

    /* VIEW TOGGLE */
    .view-toggle {
        display: inline-flex;
        background: #f1f3f5;
        border-radius: 10px;
        padding: 3px; gap: 2px;
        border: 1px solid var(--border);
    }
    .view-toggle button {
        padding: 7px 14px;
        border: none; background: transparent;
        border-radius: 8px;
        font-size: 11px; font-weight: 600;
        font-family: inherit;
        color: var(--text-secondary);
        cursor: pointer; transition: all 0.18s;
        display: inline-flex; align-items: center; gap: 5px;
    }
    .view-toggle button.active {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 2px 8px rgba(255,140,0,0.3);
        font-weight: 700;
    }
    .view-toggle button:hover:not(.active) {
        color: var(--text-primary);
        background: #e5e7eb;
    }

    /* DRE TABLE */
    #tabelaDRE { font-size: 10px; }
    #tabelaDRE thead th { font-size: 9px; padding: 8px 4px; }
    #tabelaDRE tbody td { font-size: 10px; padding: 8px 4px; }
    .dre-row-clickable { cursor: pointer; }
    .dre-row-clickable:hover td {
        background: #fff8ed !important;
        box-shadow: inset 0 0 0 1px rgba(255, 140, 0, 0.2);
    }

    /* MODAL */
    .modal-overlay {
        display: none; position: fixed; inset: 0;
        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(3px);
        z-index: 2000;
        align-items: center; justify-content: center;
        padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
        background: #fff;
        border-radius: 16px;
        box-shadow: var(--shadow-lg);
        max-width: 720px; width: 100%;
        max-height: 92vh; overflow-y: auto;
        padding: 24px 26px;
        animation: modalSlide 0.22s ease;
    }
    @keyframes modalSlide {
        from { opacity: 0; transform: scale(0.97) translateY(6px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 18px; padding-bottom: 14px;
        border-bottom: 1px solid var(--border); gap: 12px;
    }
    .modal-header h2 {
        font-size: 16px; font-weight: 700;
        color: var(--text-primary);
        display: flex; align-items: center; gap: 9px;
    }
    .modal-header h2 i { color: var(--accent); font-size: 15px; }
    .modal-close {
        width: 32px; height: 32px;
        display: flex; align-items: center; justify-content: center;
        border: none; background: #f1f3f5;
        color: var(--text-secondary);
        border-radius: 8px;
        font-size: 14px; cursor: pointer;
        transition: all 0.18s;
    }
    .modal-close:hover { background: var(--danger); color: #fff; }

    .form-group { margin-bottom: 13px; }
    .form-group label {
        display: block; font-size: 10.5px;
        color: var(--text-secondary);
        margin-bottom: 5px;
        text-transform: uppercase;
        font-weight: 700; letter-spacing: 0.5px;
    }
    .form-group label i { color: var(--accent); margin-right: 4px; }
    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 10px 12px;
        background: #f9fafb;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 12.5px; font-family: inherit; font-weight: 500;
        outline: none; transition: all 0.18s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        background: #fff;
        border-color: var(--accent);
        box-shadow: var(--glow-orange);
    }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }

    .modal-actions {
        display: flex; gap: 8px; justify-content: flex-end;
        margin-top: 18px; padding-top: 14px;
        border-top: 1px solid var(--border);
    }

    /* TOAST */
    .toast {
        position: fixed; bottom: 22px; right: 22px;
        z-index: 10000;
        padding: 14px 20px;
        border-radius: 10px;
        font-size: 12.5px; font-weight: 600;
        color: #fff;
        box-shadow: var(--shadow-lg);
        max-width: 380px;
        animation: toastIn 0.25s ease;
        display: flex; align-items: center; gap: 10px;
    }
    @keyframes toastIn {
