    <style>

            border: 1px solid rgba(255, 140, 0, 0.15);

        }

        }

        .ponto-table .hora-extra { background: rgba(40,167,69,0.1); color: #28a745; font-weight: 700; }
        .ponto-table .hora-extra-negative { background: rgba(220,53,69,0.1); color: #dc3545; font-weight: 700; }
        
        /* ===== MODAL PADRÃO ===== */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            padding: 16px;
        }
        .modal.active { display: flex !important; }
        .modal-content {
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            max-width: 1300px;
            width: 100%;
            max-height: 95vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalFadeIn 0.3s ease;
        }
        
        /* ===== MODAL LOGIN - CORRIGIDO ===== */
        .modal-login {

        .modal-login .form-group input,

        .modal-sm { max-width: 700px; }
        .modal-md { max-width: 900px; }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 2px solid #FF8C00;

        // ============================================================
        const SUPABASE_URL = 'https://avzxplcdutqzlxfievza.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_rkwsOtfEMpic9PsiExxC_w_rzYqZNRs';
        
        console.log('🚀 Inicializando Supabase...');
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: {
                autoRefreshToken: true,
                persistSession: true,
                detectSessionInUrl: false
            }
        });

        // ============================================================
        // SISTEMA DE AUTENTICAÇÃO E PERFIS

        const STORAGE_KEY = 'usuarios_sistema';

        const ROLES = {
            VIEWER: 'viewer',
            USER: 'user',
            ADMIN: 'admin'
        };

            'user': 'Usuário',
            'admin': 'Administrador'
        };

            'viewer': '#6c757d',
            'user': '#28a745',
            'admin': '#dc3545'
        };

        // USUÁRIOS PADRÃO
        const USUARIOS_PADRAO = [
            { id: 'admin_1', nome: 'admin', senha: 'admin123', role: 'admin' },
            { id: 'user_1', nome: 'usuario', senha: '1234', role: 'user' },
            { id: 'viewer_1', nome: 'visitante', senha: '1234', role: 'viewer' }
        ];

        // ============================================================
        // FUNÇÕES DE USUÁRIOS
        // ============================================================
        function carregarUsuarios() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    const parsed = JSON.parse(data);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        console.log('📋 Usuários carregados do localStorage:', parsed.length);
                        return parsed;
                    }
                }
            } catch (e) {
                console.error('Erro ao carregar usuários:', e);
            }
            
            console.log('🔧 Criando usuários padrão...');
            return criarUsuariosPadrao();
        }

        function criarUsuariosPadrao() {
            try {
                const existing = localStorage.getItem(STORAGE_KEY);
                if (existing) {
                    try {
                        const parsed = JSON.parse(existing);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            console.log('✅ Usuários já existem no localStorage');
                            return parsed;
                        }
                    } catch (e) {}
                }
                
                salvarUsuarios(USUARIOS_PADRAO);
                console.log('✅ Usuários padrão criados e salvos:', USUARIOS_PADRAO.length);
                return USUARIOS_PADRAO;
            } catch (e) {
                console.error('Erro ao criar usuários padrão:', e);
                return USUARIOS_PADRAO;
            }
        }

        function salvarUsuarios(usuarios) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(usuarios));
                console.log('✅ Usuários salvos no localStorage:', usuarios.length);
                return true;
            } catch (e) {
                console.error('❌ Erro ao salvar usuários:', e);
                return false;
            }
        }

        function inicializarUsuarios() {
            console.log('🔐 Inicializando sistema de usuários...');
            const usuarios = carregarUsuarios();
            console.log('📋 Total de usuários:', usuarios.length);
            return usuarios;
        }

        // ============================================================
        // FUNÇÃO AUTENTICAR
        // ============================================================
        function autenticar(nome, senha) {
            console.log('🔍 Tentando autenticar:', nome);
            
            const usuarios = carregarUsuarios();
            console.log('📋 Usuários disponíveis para autenticação:', usuarios.map(u => u.nome));
            
            const usuario = usuarios.find(u => 
                u.nome.toLowerCase() === nome.toLowerCase() && 
                u.senha === senha
            );
            
            if (usuario) {
                usuarioAtual = { ...usuario };
                salvarSessao();
                atualizarUI();
                console.log('✅ Usuário autenticado com sucesso:', usuario.nome, 'Perfil:', usuario.role);
                return true;

            console.log('❌ Falha na autenticação para:', nome);
            return false;
        }

        function salvarSessao() {
            if (usuarioAtual) {
                try {
                    sessionStorage.setItem('usuarioAtual', JSON.stringify(usuarioAtual));
                    console.log('💾 Sessão salva para:', usuarioAtual.nome);

                    console.error('Erro ao salvar sessão:', e);

            }
        }

            const isUser = usuarioAtual && (usuarioAtual.role === 'user' || usuarioAtual.role === 'admin');

            const botoesEdicao = [
                'btnSalvarFuncionario', 'btnAplicarEditor', 'btnSalvarAjustes', 
                'btnCorrigirErros', 'btnPreencher', 'btnOCR', 'btnLimparImagem'
            ];
            botoesEdicao.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.disabled = !isUser;
                    el.style.opacity = isUser ? '1' : '0.5';
                }
            });

            const uploadArea = document.getElementById('uploadArea');
            if (uploadArea) {
                if (isUser) {
                    uploadArea.classList.remove('disabled');
                    uploadArea.querySelector('input[type="file"]').disabled = false;
                } else {
                    uploadArea.classList.add('disabled');
                    uploadArea.querySelector('input[type="file"]').disabled = true;
                }
            }

            document.querySelectorAll('.btn-acao-tabela.btn-editar, .btn-acao-tabela.btn-excluir').forEach(el => {
                el.disabled = !isUser;
            });

            document.querySelectorAll('.action-bar .btn-danger').forEach(el => {
                el.disabled = !isUser;
            });

            const modoMsg = document.getElementById('editorModoMsg');
            if (modoMsg) {
                modoMsg.textContent = isUser ? 'Modo: Edição' : 'Modo: Visualização';
                modoMsg.style.color = isUser ? '#28a745' : '#ffc107';
            }

            document.querySelectorAll('.linha-grid input').forEach(el => {
                el.disabled = !isUser;
            });
        }

        // ============================================================
        // FUNÇÃO FECHAR LOGIN
        // ============================================================
        function fecharLogin() {
            console.log('🔒 fecharLogin() chamado');
            
            const modalLogin = document.getElementById('modalLogin');
            const mainContainer = document.getElementById('mainContainer');
            
            if (modalLogin) {
                modalLogin.classList.remove('active');
                modalLogin.style.display = 'none';
            }
            
            if (mainContainer) {
                mainContainer.style.display = 'block';
                mainContainer.style.visibility = 'visible';
                mainContainer.style.opacity = '1';
                mainContainer.style.pointerEvents = 'auto';
            }
            
            document.body.style.overflow = 'auto';
            document.body.style.position = 'static';
            
            if (!usuarioAtual || !usuarioAtual.nome || usuarioAtual.nome === 'Visitante') {
                const sessionUser = sessionStorage.getItem('usuarioAtual');
                if (sessionUser) {
                    try {
                        usuarioAtual = JSON.parse(sessionUser);
                        console.log('✅ Sessão restaurada para:', usuarioAtual.nome);
                    } catch (e) {
                        usuarioAtual = { 
                            id: 'visitante_' + Date.now(), 
                            nome: 'Visitante', 
                            role: 'viewer' 
                        };
                        salvarSessao();
                    }
                } else {
                    usuarioAtual = { 
                        id: 'visitante_' + Date.now(), 
                        nome: 'Visitante', 
                        role: 'viewer' 
                    };
                    salvarSessao();
                }
            }
            
            atualizarUI();
            
            setTimeout(() => {
                carregarDadosCompletosComFallback();
            }, 200);
            
            console.log('✅ Modal fechado, interface liberada!');
        }

        // ============================================================
        // FUNÇÃO FAZER LOGIN
        // ============================================================
        function fazerLogin() {
            console.log('🔑 fazerLogin() chamado');
            
            const select = document.getElementById('loginUsuario');
            const nome = select ? select.value : '';
            const senha = document.getElementById('loginSenha').value;
            const erro = document.getElementById('loginErro');

            if (!nome) {
                erro.textContent = '⚠️ Selecione um usuário!';
                erro.style.display = 'block';
                return;
            }

            if (!senha) {
                erro.textContent = '⚠️ Digite a senha!';
                erro.style.display = 'block';
                return;
            }

            console.log('🔑 Tentando login com:', nome, 'senha:', senha);

            if (autenticar(nome, senha)) {
                console.log('✅ Login bem-sucedido!');
                
                const modalLogin = document.getElementById('modalLogin');
                const mainContainer = document.getElementById('mainContainer');
                
                if (modalLogin) {
                    modalLogin.classList.remove('active');
                    modalLogin.style.display = 'none';
                }
                
                if (mainContainer) {
                    mainContainer.style.display = 'block';
                    mainContainer.style.visibility = 'visible';
                    mainContainer.style.opacity = '1';
                }
                
                document.body.style.overflow = 'auto';
                document.body.style.position = 'static';
                
                atualizarUI();
                mostrarToast('✅ Bem-vindo, ' + nome + '! (' + ROLE_LABELS[usuarioAtual.role] + ')');
                
                erro.style.display = 'none';
                document.getElementById('loginSenha').value = '';
                
                setTimeout(() => {
                    carregarDadosCompletosComFallback();
                }, 200);
                
                console.log('✅ Login concluído, interface aberta para:', nome);
                
            } else {
                erro.textContent = '❌ Usuário ou senha incorretos!';
                erro.style.display = 'block';
                document.getElementById('loginSenha').value = '';
                document.getElementById('loginSenha').focus();
                console.log('❌ Falha no login para:', nome);
            }
        }

        // ============================================================
        // FUNÇÃO INIT AUTH
        // ============================================================
        function initAuth() {
            console.log('🔐 Inicializando autenticação...');
            
            const usuarios = inicializarUsuarios();
            console.log('📋 Usuários disponíveis:', usuarios);
            
            const sessionUser = sessionStorage.getItem('usuarioAtual');
            if (sessionUser) {
                try {
                    const user = JSON.parse(sessionUser);
                    const found = usuarios.find(u => u.id === user.id);
                    if (found) {
                        usuarioAtual = found;
                        console.log('✅ Sessão restaurada para:', usuarioAtual.nome);
                        
                        const modalLogin = document.getElementById('modalLogin');
                        if (modalLogin) {
                            modalLogin.classList.remove('active');
                            modalLogin.style.display = 'none';
                        }
                        
                        const mainContainer = document.getElementById('mainContainer');
                        if (mainContainer) {
                            mainContainer.style.display = 'block';
                            mainContainer.style.visibility = 'visible';
                            mainContainer.style.opacity = '1';
                        }
                        
                        document.body.style.overflow = 'auto';
                        document.body.style.position = 'static';
                        
                        atualizarUI();
                        
                        setTimeout(() => {
                            carregarDadosCompletosComFallback();
                        }, 200);
                        return;
                    } else {
                        console.log('⚠️ Usuário da sessão não encontrado, removendo sessão');
                        sessionStorage.removeItem('usuarioAtual');
                    }
                } catch (e) {
                    console.error('Erro ao restaurar sessão:', e);
                    sessionStorage.removeItem('usuarioAtual');
                }
            }
            
            console.log('🔓 Nenhuma sessão ativa. Mostrando modal de login...');
            
            const modalLogin = document.getElementById('modalLogin');
            if (modalLogin) {
                modalLogin.classList.add('active');
                modalLogin.style.display = 'flex';
            }
            
            carregarUsuariosLogin();
            
            usuarioAtual = { 
                id: 'visitante_' + Date.now(), 
                nome: 'Visitante', 
                role: 'viewer' 
            };
            salvarSessao();
            atualizarUI();
            console.log('👤 Modo visitante ativado (aguardando login)');
            
            setTimeout(() => {
                carregarDadosCompletosComFallback();
            }, 500);
        }

        // ============================================================
        // FUNÇÕES DE LOGIN
        // ============================================================
        function carregarUsuariosLogin() {
            console.log('🔄 carregarUsuariosLogin() chamada');
            const select = document.getElementById('loginUsuario');
            if (!select) {
                console.error('❌ Elemento loginUsuario não encontrado!');
                return;
            }
            
            const usuarios = carregarUsuarios();
            console.log('📋 Carregando usuários no select:', usuarios);
            
            select.innerHTML = '';
            
            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = '-- Selecione um usuário --';
            select.appendChild(defaultOption);
            
            if (usuarios && usuarios.length > 0) {
                usuarios.forEach(u => {
                    const option = document.createElement('option');
                    option.value = u.nome;
                    option.textContent = u.nome + ' (' + ROLE_LABELS[u.role] + ')';
                    select.appendChild(option);
                });
                console.log('✅ ' + usuarios.length + ' usuários carregados no select');
            } else {
                console.warn('⚠️ Nenhum usuário encontrado! Criando padrão...');
                const novosUsuarios = criarUsuariosPadrao();
                novosUsuarios.forEach(u => {
                    const option = document.createElement('option');
                    option.value = u.nome;
                    option.textContent = u.nome + ' (' + ROLE_LABELS[u.role] + ')';
                    select.appendChild(option);
                });
            }
        }

        // ============================================================
        // FUNÇÃO DE CARREGAMENTO COM FALLBACK
        // ============================================================
        async function carregarDadosCompletosComFallback() {
            try {
                await carregarDadosCompletos();
            } catch (error) {
                console.error('❌ Erro ao carregar dados, usando modo offline:', error);
                mostrarToast('⚠️ Modo offline: Dados carregados localmente', 'warning');
                
                if (funcionariosCadastrados.length === 0) {
                    try {
                        const localData = localStorage.getItem('funcionarios_offline');
                        if (localData) {
                            const parsed = JSON.parse(localData);
                            if (Array.isArray(parsed) && parsed.length > 0) {
                                funcionariosCadastrados = parsed;
                                console.log('📋 Dados carregados do localStorage:', funcionariosCadastrados.length);
                            }
                        }
                    } catch (e) {
                        console.error('Erro ao carregar dados locais:', e);
                    }
                }
                
                renderizarTabelaCadastrados();
                carregarDatalist();
                carregarSelectCartao();
                atualizarContador();
                atualizarBadgeErros();
                
                if (funcionarioAtual) {
                    const func = funcionariosCadastrados.find(f => f.nome === funcionarioAtual);
                    if (func) {
                        funcionarioIdAtual = func.id;
                        dadosHorarios = pontosPorFuncionario[funcionarioAtual] || {};
                        gerarTabela();
                    }
                }
            }
        }

        // ============================================================
        // CARREGAR DADOS DO SUPABASE
        // ============================================================
        async function carregarDadosCompletos() {
            try {
                console.log('🔄 Carregando dados do Supabase...');
                mostrarToast('🔄 Carregando dados...');
                
                const mes = document.getElementById('mes').value;
                const ano = parseInt(document.getElementById('ano').value);
                mesAtual = mes;
                anoAtual = ano;

                try {
                    const { data: funcData, error: funcError } = await supabaseClient
                        .from('funcionarios')
                        .select('*')
                        .order('nome');

                    if (funcError) {
                        console.warn('⚠️ Erro ao carregar funcionários:', funcError);
                        throw new Error('Erro ao carregar funcionários: ' + funcError.message);
                    }

                    if (funcData && funcData.length > 0) {
                        funcionariosCadastrados = funcData;
                        try {
                            localStorage.setItem('funcionarios_offline', JSON.stringify(funcData));
                        } catch (e) {}
                        console.log(`✅ ${funcData.length} funcionários carregados`);
                    } else {
                        funcionariosCadastrados = [];
                        console.log('⚠️ Nenhum funcionário encontrado no Supabase');
                    }
                } catch (funcError) {
                    console.error('❌ Erro crítico ao carregar funcionários:', funcError);
                    try {
                        const localData = localStorage.getItem('funcionarios_offline');
                        if (localData) {
                            const parsed = JSON.parse(localData);
                            if (parsed && parsed.length > 0) {
                                funcionariosCadastrados = parsed;
                                console.log('📋 Funcionários carregados do localStorage (fallback):', parsed.length);
                            }
                        }
                    } catch (e) {}
                    throw funcError;
                }

                try {
                    await carregarMarcacoesDoMes(mes, ano);
                } catch (marcError) {
                    console.warn('⚠️ Erro ao carregar marcações:', marcError);
                    pontosPorFuncionario = {};
                }

                try {
                    await carregarImagensDoMes(mes, ano);
                } catch (imgError) {
                    console.warn('⚠️ Erro ao carregar imagens:', imgError);
                    imagemCartaoPorFuncionario = {};
                }

                renderizarTabelaCadastrados();
                carregarDatalist();
                carregarSelectCartao();
                atualizarContador();
                atualizarBadgeErros();

                if (funcionarioAtual) {
                    const func = funcionariosCadastrados.find(f => f.nome === funcionarioAtual);
                    if (func) {
                        funcionarioIdAtual = func.id;
                        dadosHorarios = pontosPorFuncionario[funcionarioAtual] || {};
                        gerarTabela();
                    } else {
                        funcionarioAtual = null;
                        funcionarioIdAtual = null;
                        dadosHorarios = {};
                        gerarTabela();
                    }
                }

                mostrarToast('✅ Dados carregados!');

            } catch (error) {
                console.error('❌ Erro ao carregar dados:', error);
                mostrarToast('⚠️ ' + error.message, 'error');
                
                renderizarTabelaCadastrados();
                carregarDatalist();
                carregarSelectCartao();
                atualizarContador();
                atualizarBadgeErros();
            }
        }

        // ============================================================
        let funcionariosCadastrados = [];
        let pontosPorFuncionario = {};
        let imagemCartaoPorFuncionario = {};
        let funcionarioAtual = null;
        let dadosHorarios = {};
        let mesAtual = "Janeiro";

        // ============================================================
        // FUNÇÃO MOSTRAR TOAST
        // ============================================================
        function mostrarToast(msg, tipo = '') {
            const toast = document.getElementById('toastSucesso');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;
            toast.style.display = 'block';
            toast.className = 'toast';
            if (tipo === 'error') toast.classList.add('error');
            if (tipo === 'warning') toast.classList.add('warning');
            setTimeout(() => { toast.style.display = 'none'; }, 3500);
        }

            const sidebar = document.getElementById('sidebar');

                sidebar.classList.toggle('open');
            }
        }

        function toggleSidebarMobile() {
            if (window.innerWidth <= 768) {
                const sidebar = document.getElementById('sidebar');
                const toggle = document.getElementById('sidebarToggle');
                sidebar.classList.add('collapsed');
                sidebar.classList.remove('open');
                toggle.classList.add('collapsed');
            }
        }
